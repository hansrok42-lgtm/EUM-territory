<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="EUM 권역검색"><title>EUM PARTNERS | 용산서부 권역검색기</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;background:#f5f7fb;color:#111827}.wrap{max-width:720px;margin:auto;padding:22px 16px 50px}.hero{background:#fff;border-radius:26px;padding:25px 20px;box-shadow:0 10px 35px #17203312;text-align:center}.brand{font-size:13px;font-weight:900;letter-spacing:2px;color:#1677ff}.hero h1{margin:8px 0 4px;font-size:29px}.sub{color:#6b7280;font-size:15px}.search{display:flex;gap:9px;margin-top:22px}.search input{min-width:0;flex:1;border:2px solid #e5e7eb;border-radius:15px;padding:16px;font-size:17px;outline:none}.search input:focus{border-color:#1677ff}.search button{border:0;border-radius:15px;background:#1677ff;color:white;font-size:16px;font-weight:800;padding:0 20px}.result{display:none;margin-top:15px;padding:17px;border-radius:16px;text-align:left;font-weight:800}.yes{display:block;background:#eaf8ef;color:#137333}.no{display:block;background:#fff0f0;color:#b42318}.hint{margin-top:10px;font-size:13px;color:#6b7280;text-align:left}.card{margin-top:16px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 28px #1720330c}.card h2{font-size:19px;margin:0 0 13px}.mapbox{min-height:235px;border:2px dashed #dbe2ea;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:#64748b;background:linear-gradient(135deg,#f8fbff,#f5fff8)}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#f1f5f9;border-radius:999px;padding:8px 11px;font-size:13px}.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}@media(max-width:430px){.hero h1{font-size:24px}.search button{padding:0 16px}}</style></head><body><main class="wrap"><section class="hero"><div class="brand">EUM PARTNERS</div><h1>이음파트너스 용산서부</h1><div class="sub">권역 검색기</div><div class="search"><input id="q" placeholder="예: 한남동 123" autocomplete="street-address"><button onclick="go()">검색</button></div><div id="r" class="result"></div><div class="hint">법정동명과 번지를 함께 입력해도 검색됩니다. 예: 서울 용산구 한남동 123</div></section><section class="card"><h2>🗺️ 용산서부 권역지도</h2><div class="mapbox"><div><b>용산·마포 용산서부 권역</b><br><br>권역 지도 이미지는 다음 업데이트에서 이 영역에 표시됩니다.<br>현재 검색 판정은 등록된 52개 법정동을 기준으로 작동합니다.</div></div></section><section class="card"><h2>포함 법정동 52곳</h2><div id="chips" class="chips"></div></section><div class="foot">EUM PARTNERS · 서울_용산서부</div></main><script>const d=['갈월동','공덕동','구수동','남영동','노고산동','대흥동','도원동','도화동','동빙고동','동자동','마포동','문배동','보광동','산천동','서계동','서빙고동','신계동','신공덕동','신수동','신정동','신창동','아현동','염리동','용강동','용문동','용산동1가','용산동2가','용산동3가','용산동4가','용산동5가','용산동6가','원효로1가','원효로2가','원효로3가','원효로4가','이촌동','이태원동','주성동','창전동','청암동','청파동1가','청파동2가','청파동3가','토정동','하중동','한강로1가','한강로2가','한강로3가','한남동','현석동','효창동','후암동'];document.getElementById('chips').innerHTML=d.map(x=>'<span class="chip">'+x+'</span>').join('');function go(){let q=document.getElementById('q').value.replace(/\s+/g,'');let m=d.find(x=>q.includes(x));let r=document.getElementById('r');if(!q){r.className='result no';r.innerHTML='주소 또는 법정동을 입력해주세요.';return}if(m){r.className='result yes';r.innerHTML='✅ 권역 내 지역입니다<br><span style="font-weight:500;font-size:14px">'+m+' · 서울_용산서부</span>'}else{r.className='result no';r.innerHTML='❌ 현재 등록된 용산서부 법정동에서 찾지 못했습니다.<br><span style="font-weight:500;font-size:14px">도로명 주소만 입력한 경우 법정동명을 함께 입력해주세요.</span>'}}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
