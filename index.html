<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EUM 권역검색">
<link rel="icon" href="data:,">
<title>EUM PARTNERS | 용산서부 권역검색기</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;background:#f5f7fb;color:#111827}
.wrap{max-width:720px;margin:auto;padding:22px 16px 50px}.hero{background:#fff;border-radius:26px;padding:25px 20px;box-shadow:0 10px 35px #17203312;text-align:center}
.brand{font-size:13px;font-weight:900;letter-spacing:2px;color:#1677ff}.hero h1{margin:8px 0 4px;font-size:29px}.sub{color:#6b7280;font-size:15px}
.search{display:flex;gap:9px;margin-top:22px}.search input{min-width:0;flex:1;border:2px solid #e5e7eb;border-radius:15px;padding:16px;font-size:17px;outline:none}
.search input:focus{border-color:#1677ff}.search button{border:0;border-radius:15px;background:#1677ff;color:#fff;font-size:16px;font-weight:800;padding:0 20px;cursor:pointer}
.result{display:none;margin-top:15px;padding:17px;border-radius:16px;text-align:left;font-weight:800}.yes{display:block;background:#eaf8ef;color:#137333}.no{display:block;background:#fff0f0;color:#b42318}
.hint{margin-top:12px;font-size:13px;color:#6b7280;text-align:left;line-height:1.5}.card{margin-top:16px;background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 28px #1720330c}
.card h2{font-size:19px;margin:0 0 13px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#f1f5f9;border-radius:999px;padding:8px 11px;font-size:13px}
.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}@media(max-width:430px){.hero h1{font-size:24px}.search button{padding:0 16px}}
</style>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=58ab21636e031d3caf7970afbc8cc7c9&libraries=services"></script>
</head>
<body>
<main class="wrap">
<section class="hero">
<div class="brand">EUM PARTNERS</div><h1>이음파트너스 용산서부</h1><div class="sub">권역 검색기</div>
<div class="search"><input id="q" placeholder="예: 대사관로34길 10 / 한남동 123" autocomplete="street-address"><button id="searchBtn" type="button">검색</button></div>
<div id="r" class="result"></div>
<div class="hint">도로명주소·지번주소 모두 입력 후 검색만 누르세요. 별도 주소 선택창 없이 바로 법정동 기준으로 권역을 판정합니다.</div>
</section>
<section class="card"><h2>포함 법정동 52곳</h2><div id="chips" class="chips"></div></section>
<div class="foot">EUM PARTNERS · 서울_용산서부</div>
</main>
<script>
(function(){
var d=["갈월동", "공덕동", "구수동", "남영동", "노고산동", "대흥동", "도원동", "도화동", "동빙고동", "동자동", "마포동", "문배동", "보광동", "산천동", "서계동", "서빙고동", "신계동", "신공덕동", "신수동", "신정동", "신창동", "아현동", "염리동", "용강동", "용문동", "용산동1가", "용산동2가", "용산동3가", "용산동4가", "용산동5가", "용산동6가", "원효로1가", "원효로2가", "원효로3가", "원효로4가", "이촌동", "이태원동", "주성동", "창전동", "청암동", "청파동1가", "청파동2가", "청파동3가", "토정동", "하중동", "한강로1가", "한강로2가", "한강로3가", "한남동", "현석동", "효창동", "후암동"];
var qEl=document.getElementById('q'),r=document.getElementById('r');
document.getElementById('chips').innerHTML=d.map(function(x){return '<span class="chip">'+x+'</span>'}).join('');
function showResult(m,label){
 if(m){r.className='result yes';r.innerHTML='✅ 권역 내 지역입니다<br><span style="font-weight:500;font-size:14px">'+(label||m)+'<br>법정동: '+m+' · 서울_용산서부</span>';}
 else{r.className='result no';r.innerHTML='❌ 용산서부 권역 밖입니다.<br><span style="font-weight:500;font-size:14px">'+(label||'현재 등록된 52개 법정동에 포함되지 않습니다.')+'</span>';}
}
function go(){
 var raw=qEl.value.trim(), compact=raw.replace(/\s+/g,'');
 if(!raw){r.className='result no';r.innerHTML='주소를 입력해주세요.';return;}
 var direct=d.find(function(x){return compact.indexOf(x)>-1});
 if(direct){showResult(direct,raw);return;}
 if(!window.kakao || !kakao.maps || !kakao.maps.services){r.className='result no';r.innerHTML='주소검색 서비스를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.';return;}
 r.className='result yes';r.innerHTML='주소를 확인하는 중입니다...';
 var geocoder=new kakao.maps.services.Geocoder();
 geocoder.addressSearch(raw,function(result,status){
   if(status===kakao.maps.services.Status.OK && result && result.length){
     var item=result[0], addr=item.address||{}, road=item.road_address||{};
     var dong=(addr.region_3depth_name||'').trim();
     var m=d.find(function(x){return x===dong});
     var label=(road.address_name||item.address_name||raw)+(dong?' · '+dong:'');
     showResult(m,label);
   } else {
     r.className='result no';r.innerHTML='주소를 찾지 못했습니다.<br><span style="font-weight:500;font-size:14px">도로명 또는 지번주소를 조금 더 정확하게 입력해주세요.</span>';
   }
 });
}
document.getElementById('searchBtn').addEventListener('click',go);
qEl.addEventListener('keydown',function(e){if(e.key==='Enter'||e.keyCode===13)go();});
})();
</script>
</body></html>
