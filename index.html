.className='result no';r.innerHTML='주소 또는 법정동을 입력해주세요.';return}let m=d.find(x=>q.includes(x));if(m){showResult(m,raw);return}let kr=knownRoads.find(([road])=>q.includes(road));if(kr){showResult(kr[1],raw);return}r.className='result info';r.innerHTML='🔎 도로명주소를 확인합니다.<br><span style="font-weight:500;font-size:14px">아래 주소검색창에서 정확한 주소를 한 번 선택해주세요.</span>';roadSearch(raw)}function roadSearch(query){if(!window.kakao||!kakao.Postcode){let r=document.getElementById('r');r.className='result no';r.innerHTML='주소검색 서비스를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';return}new kakao.Postcode({oncomplete:function(data){const road=data.roadAddress||data.address||'';const jibun=data.jibunAddress||'';const bname=(data.bname||'').trim();document.getElementById('q').value=road||jibun;let m=d.find(x=>x===bname)||d.find(x=>(jibun+road).includes(x));showResult(m,(road||jibun)+(bname?' · '+bname:''));}}).open(query?{q:query}:undefined)}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
